services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5237:5237"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://0.0.0.0:5237
      Server__Port: "5237"
      DATA_DIR: /app/data
    volumes:
      - ./var/data:/app/data
    restart: unless-stopped
