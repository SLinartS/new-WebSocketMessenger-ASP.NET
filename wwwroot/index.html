<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Chat</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>

<body>
    <div class="container">
        <div id="status" class="status disconnected">Disconnected</div>

        <div class="chat-wrapper">
            <div class="chat-main">
                <div id="currentChatInfo" class="current-chat-info">Current chat: Общий чат</div>

                <div id="messages" class="messages"></div>

                <div id="typingIndicator" class="typing-indicator"></div>

                <div class="input-area">
                    <input id="name" type="text" placeholder="Your name" maxlength="20">
                    
                    <input id="message" type="text" placeholder="Message..." maxlength="500">
                    
                    <button id="sendBtn" disabled>Send</button>
                    
                    <button id="clearBtn" disabled>Clear</button>
                </div>
            </div>

            <div class="sidebar">
                <div class="chat-list-panel">
                    <h3 class="sidebar-title">Chats</h3>
                    <div id="chatList" class="chat-list"></div>
                </div>

                <div class="user-info-panel">
                    <div class="user-id-display">
                        <span class="user-id-label">Your ID:</span>
                        <span id="myUserId" class="user-id-value">Loading...</span>
                        <button id="copyUserIdBtn" class="copy-btn" title="Copy to clipboard">Copy</button>
                    </div>
                </div>

                <div class="find-user-panel">
                    <input id="findUserInput" type="text" placeholder="Enter user ID to chat">
                    <button id="findUserBtn">Chat</button>
                </div>

                <div class="users-panel">
                    <h3 class="users-panel-title">Online</h3>
                    <div id="usersList" class="users-list"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="/js/app.js"></script>
</body>

</html>
